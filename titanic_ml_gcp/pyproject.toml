[project]
name = "titanic-ml-gcp"
version = "0.1.0"
description = "End-to-end ML pipeline for Titanic survival prediction on GCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["machine-learning", "gcp", "vertex-ai", "mlops", "kubernetes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML and Data Science
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    
    # HuggingFace Datasets
    "datasets>=2.14.0,<3.0.0",
    
    # Google Cloud Platform
    "google-cloud-aiplatform>=1.35.0,<2.0.0",
    "google-cloud-storage>=2.10.0,<3.0.0",
    "google-cloud-logging>=3.5.0,<4.0.0",
    "google-auth>=2.23.0,<3.0.0",
    
    # MLflow
    "mlflow>=2.7.0,<3.0.0",
    "mlflow-skinny>=2.7.0,<3.0.0",
    
    # Optuna
    "optuna>=3.3.0,<4.0.0",
    "optuna-integration>=3.3.0,<4.0.0",
    
    # Model Explainability
    "shap>=0.42.0,<1.0.0",
    
    # Streamlit for UI
    "streamlit>=1.27.0,<2.0.0",
    
    # Visualization
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "plotly>=5.17.0,<6.0.0",
    
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31.0,<3.0.0",
    "tqdm>=4.66.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    
    # Code Quality
    "black>=23.7.0,<24.0.0",
    "flake8>=6.1.0,<7.0.0",
    "mypy>=1.5.0,<2.0.0",
]

inference = [
    # For custom inference server (if building separate service)
    "fastapi>=0.103.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "pydantic>=2.3.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

